<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#0a0a0b">
<title>ZEX Remote Monitor - Admin</title><link rel="stylesheet" href="css/style.css"></head><body>
<section id="login" class="center"><form id="loginForm" class="card narrow">
 <div class="brand">ZEX<span>REMOTE MONITOR</span></div><p>Administrator sign in</p>
 <input id="email" type="email" placeholder="Email" autocomplete="username" required>
 <input id="pass" type="password" placeholder="Password" autocomplete="current-password" required>
 <button>Sign in</button><div id="err" class="err"></div></form></section>
<main id="app" hidden>
 <header class="top"><div class="brand">ZEX<span>REMOTE MONITOR</span></div><button id="logout" class="ghost sm">Sign out</button></header>
 <div class="stats">
  <div class="card stat"><b id="sTot">0</b><span>Registered participants</span></div>
  <div class="card stat"><b id="sAct">0</b><span>Active camera sessions</span></div>
  <div class="card stat"><b id="sOff">0</b><span>Offline participants</span></div></div>
 <div class="grid">
  <section class="card"><h2>New invitation</h2>
   <div class="row"><input id="label" maxlength="40" placeholder="Label (optional)">
   <select id="dur"><option value="10">Expires in 10 min</option><option value="30">30 min</option><option value="60" selected>60 min</option></select></div>
   <button id="newBtn" style="width:100%;margin-top:10px">Generate QR code</button>
   <div id="qrBox" hidden><div id="qr"></div><div id="link"></div><button id="copy" class="ghost sm">Copy link</button></div></section>
  <section class="card" id="panel" hidden><h2>Live view <span id="pinfo" class="mut"></span></h2>
   <div class="stage"><div class="live"><i></i>LIVE</div><video id="vid" autoplay playsinline muted></video></div>
   <div class="row" style="margin-top:10px"><span class="net">Connection: <b id="cstate">connecting</b></span>
   <button id="stopView" class="ghost sm">Close view</button><button id="kick" class="sm">Disconnect participant</button></div></section></div>
 <section class="card"><h2>Session history</h2><div id="list"></div></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/admin.js"></script></body></html>
